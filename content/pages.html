<section class="work-page" id="pages-page">
<header class="page-head"><div><a id="pages-repo">Repository</a><h1>Pages</h1><p class="muted">Build through Actions, preview, then promote an immutable deployment.</p></div><select id="pages-kind" aria-label="Site destination"><option value="project">Repository site</option><option value="owner">Owner default site</option></select></header>
<p id="pages-error" class="error" role="alert" hidden></p>
<div class="work-list" style="padding:16px;overflow:auto;min-height:0">
<p id="pages-url"></p><p id="pages-hosting" class="muted">Public hosting awaits domain, DNS and TLS activation. Build and deployment records are available independently.</p>
<form id="pages-config" class="form-stack"><h2>Build configuration</h2><p id="pages-backing"></p><label>Branch or qualified tag ref<input name="ref" value="main" required></label><label>Working directory<input name="working_directory" value="." required></label><label>Build command<input name="build_command" placeholder="nift build" required></label><label>Output directory<input name="output_directory" value="public" required></label><label>SPA fallback (optional, relative to output)<input name="spa_fallback" placeholder="index.html"></label><label><input type="checkbox" name="enabled" checked> Enable new Pages builds</label><label><input type="checkbox" name="public_acknowledged"> I acknowledge that output from private source is public</label><div class="dialog-actions"><button class="btn" id="pages-save">Save configuration</button><button class="btn primary" id="pages-deploy" type="button">Deploy</button></div></form>

<h2>Deployments</h2><div id="pages-history" class="loading-state">Loading deployments…</div><div class="list-pagination"><button class="btn" id="pages-previous">Previous</button><span id="pages-count"></span><button class="btn" id="pages-next">Next</button><button class="btn" id="pages-refresh">Refresh</button></div>
</div></section><script src="/assets/js/app-pages.js"></script>
