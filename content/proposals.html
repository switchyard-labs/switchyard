<section class="work-page" id="proposal-page">
<header class="page-head"><div><a id="proposal-repo" href="#">Repository</a><h1>Proposals</h1><p class="muted">Consider, discuss and decide. Work is optional.</p></div><div class="page-head-actions" id="proposal-toolbar-actions"><button class="btn primary" id="proposal-new" hidden>New proposal</button></div></header>
<div class="work-list-toolbar"><select id="proposal-state" aria-label="Proposal state"><option value="">All states</option><option>open</option><option>accepted</option><option>deferred</option><option>closed</option></select><select id="proposal-type" aria-label="Proposal type"><option value="">All types</option></select><input id="proposal-query" placeholder="Search titles" aria-label="Search proposal titles"><input id="proposal-author" placeholder="Author" aria-label="Filter by author"><input id="proposal-label" placeholder="Label" aria-label="Filter by label"><select id="proposal-priority" aria-label="Priority"><option value="">All priorities</option><option>low</option><option>normal</option><option>high</option><option>urgent</option></select><select id="proposal-source" aria-label="Provenance"><option value="">All sources</option><option>human</option><option>agent</option><option>review</option></select><button class="btn" id="proposal-search">Search</button></div>
<p id="proposal-error" class="error" role="alert" hidden></p>
<div id="proposal-body" class="work-list"><div class="loading-state">Loading proposals…</div></div>
<div class="list-pagination"><button class="btn" id="proposal-previous">Previous</button><span id="proposal-count"></span><button class="btn" id="proposal-next">Next</button></div>
<dialog id="proposal-dialog"><form id="proposal-form" class="form-stack"><h2>New proposal</h2><label>Title<input name="title" required maxlength="240"></label><label>Type<select name="type" id="proposal-create-type"></select></label><label>Description<textarea name="description" maxlength="65536"></textarea></label><div class="dialog-actions"><button class="btn" type="button" id="proposal-close">Cancel</button><button class="btn primary">Create</button></div></form></dialog>
</section>
<script src="/assets/js/agent-task-picker.js?v=1"></script>
<script src="/assets/js/app-proposals.js"></script>
