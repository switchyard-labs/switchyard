<div class="auth-page">
 <section class="auth-card" aria-labelledby="recovery-title">
  <div class="auth-brand"><img src="/assets/images/favicon.webp" alt="" width="34" height="34"><span>Switchyard</span></div>
  <h1 id="recovery-title">Account recovery</h1>
  <p id="recovery-copy" class="muted"></p>
  <form id="recovery-form" class="auth-form" hidden>
   <label id="recovery-email-label" hidden>Email<input name="email" type="email" autocomplete="email" maxlength="254" disabled></label>
   <label id="recovery-password-label" hidden>New password<input name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="72" disabled></label>
   <label id="recovery-confirm-label" hidden>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" maxlength="72" disabled></label>
   <button type="submit" class="btn primary" id="recovery-submit">Continue</button>
  </form>
  <p id="recovery-status" role="status" aria-live="polite"></p>
  <a class="btn" id="recovery-next" href="/signin">Back to sign in</a>
 </section>
</div>
