<div class="auth-page">
  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-brand"><img src="@path('public/assets/images/favicon.webp')" alt="" width="34" height="34"><span>Switchyard</span></div>
    <h1 id="auth-title">Sign in to Switchyard</h1>
    <p class="muted auth-copy">Access repositories, Work, Pull Requests, organizations and the editor.</p>
    <form id="signin-form" class="auth-form">
      <label>Username<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label id="registration-name" hidden>Display name<input name="display_name" autocomplete="name" maxlength="120"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary auth-submit" type="submit">Sign in</button>
    </form>
    <div class="auth-divider"><span>or</span></div>
    <button class="btn auth-toggle" type="button" id="toggle-mode">Create an account</button>
    <p class="error" id="auth-error" role="alert" hidden></p>
  </section>
</div>
