<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		@input("templates/head.html")
	</head>
	<body>
		<a class="skip-link" href="#main-content">Skip to content</a>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="@path('/')"><img class="brand-mark-img" src="@path('public/assets/images/favicon.webp')" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<nav class="mobile-menu" id="mobile-menu" aria-label="Switchyard" hidden>
			<div class="mobile-menu-head"><a class="brand" href="@path('/')"><img class="brand-mark-img" src="@path('public/assets/images/favicon.webp')" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a><button class="hamburger" id="mobile-close" type="button" aria-label="Close navigation">×</button></div>
			<div class="menu-groups">
				<details class="menu-group" open><summary>Git</summary><div class="menu-links">
					<a href="@path('/')">Dashboard</a>
					<a href="repositories.html">Repositories</a>
					<a href="@path('work')">Work</a>
				</div></details>
				<details class="menu-group" open><summary>Agent-native</summary><div class="menu-links">
					<a href="/operations#attention">Needs Attention</a>
					<a href="/operations#queue">Integration Queue</a>
					<a href="/operations#workflows">Workflows</a>
					<a href="/operations#agents">Agents</a>
				</div></details>
				<details class="menu-group" open><summary>Account</summary><div class="menu-links">
					<div class="mobile-auth" id="mobile-auth"></div>
					<a href="/organizations">Organizations</a><a href="/settings">Settings</a>
				</div></details>
			</div>
			<div class="menu-footer">Git stays Git. Agent-native capability appears when you need it.</div>
		</nav>
		<main class="site-main" id="main-content">
			@content
		</main>
		<script src="@path('public/assets/js/code-surface.js')"></script>
		<script src="@path('public/assets/js/markdown.js')"></script>
		<script src="@path('public/assets/js/code-blocks.js')"></script>
		<script src="@path('public/assets/js/app.js')"></script>
	</body>
</html>
