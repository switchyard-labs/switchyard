<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Switchyard</title>
		<link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
		<link rel="stylesheet" href="/assets/css/theme.css?v=c22d">
		<link rel="stylesheet" href="/assets/css/components.css?v=avatar-fill-c42">
		<link rel="stylesheet" href="/assets/css/app.css?v=c22d">
		<link rel="stylesheet" href="/assets/css/identity.css?v=profile-c42">
	<link rel="stylesheet" href="/assets/css/operations.css?v=c21"></head>
	<body>
		<a class="skip-link" href="#main-content">Skip to content</a>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="/./"><img class="brand-mark-img" src="/assets/images/favicon.webp" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<main class="site-main" id="main-content">
			<section class="work-page" id="proposal-page">
			<header class="page-head"><div><a id="proposal-repo" href="#">Repository</a><h1>Proposals</h1><p class="muted">Consider, discuss and decide. Work is optional.</p></div><button class="btn primary" id="proposal-new" hidden>New proposal</button></header>
			<div class="work-list-toolbar"><select id="proposal-state" aria-label="Proposal state"><option value="">All states</option><option>open</option><option>accepted</option><option>deferred</option><option>closed</option></select><select id="proposal-type" aria-label="Proposal type"><option value="">All types</option></select><input id="proposal-query" placeholder="Search titles" aria-label="Search proposal titles"><input id="proposal-author" placeholder="Author" aria-label="Filter by author"><input id="proposal-label" placeholder="Label" aria-label="Filter by label"><select id="proposal-priority" aria-label="Priority"><option value="">All priorities</option><option>low</option><option>normal</option><option>high</option><option>urgent</option></select><select id="proposal-source" aria-label="Provenance"><option value="">All sources</option><option>human</option><option>agent</option><option>review</option></select><button class="btn" id="proposal-search">Search</button></div>
			<p id="proposal-error" class="error" role="alert" hidden></p>
			<div id="proposal-body" class="work-list"><div class="loading-state">Loading proposals…</div></div>
			<div class="dialog-actions"><button class="btn" id="proposal-previous">Previous</button><span id="proposal-count"></span><button class="btn" id="proposal-next">Next</button></div>
			<dialog id="proposal-dialog"><form id="proposal-form" class="form-stack"><h2>New proposal</h2><label>Title<input name="title" required maxlength="240"></label><label>Type<select name="type" id="proposal-create-type"></select></label><label>Description<textarea name="description" maxlength="65536"></textarea></label><div class="dialog-actions"><button class="btn" type="button" id="proposal-close">Cancel</button><button class="btn primary">Create</button></div></form></dialog>
			</section>
			<script src="/assets/js/app-proposals.js"></script>
		</main>
		<script src="/assets/js/code-surface.js?v=c18"></script>
		<script src="/assets/js/markdown.js?v=c18"></script>
		<script src="/assets/js/code-blocks.js"></script>
		<script src="/assets/js/app.js?v=repo-heading-c42b"></script>
	</body>
</html>
