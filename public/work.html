<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Switchyard</title>
		<link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
		<link rel="stylesheet" href="/assets/css/theme.css?v=c17">

	</head>
	<body>
		<a class="skip-link" href="#main-content">Skip to content</a>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="/./"><img class="brand-mark-img" src="/assets/images/favicon.webp" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<main class="site-main" id="main-content">
			<main><section class="panel"><div class="repo-head"><div><p class="eyebrow">Human-first task tracking</p><h1>Work</h1><p class="muted">Use Work like an issue/task tracker. Attempts and Agents are optional execution details.</p></div></div><form id="work-form" class="work-create"><input name="title" placeholder="Title" required><textarea name="body" placeholder="Describe the problem or desired outcome"></textarea><div class="inline-form"><select name="kind"><option value="feature">feature</option><option value="bug">bug</option><option value="investigation">investigation</option><option value="benchmark">benchmark</option><option value="maintenance">maintenance</option><option value="release">release</option></select><input name="repo" placeholder="owner/repository (optional)"><input name="assignee" placeholder="assignee (optional)"><button type="submit">Create work</button></div></form><div class="segmented work-filter"><button class="active" data-work-filter="open">Open</button><button data-work-filter="closed">Closed</button><button data-work-filter="all">All</button></div><div id="work-list" class="work-list"><p class="muted">Loading…</p></div></section></main>
		</main>
		<script src="/assets/js/code-surface.js"></script>
		<script src="/assets/js/markdown.js"></script>
		<script src="/assets/js/code-blocks.js"></script>
