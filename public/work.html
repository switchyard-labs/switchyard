<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Switchyard</title>
		<link rel="icon" type="image/webp" href="assets/images/favicon.webp">
		<link rel="stylesheet" href="assets/css/app.css">
	</head>
	<body>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="./"><span class="brand-mark">S</span><span class="brand-name">Switchyard</span></a>
				<nav class="site-nav" id="site-nav">
					<a href="./">Dashboard</a>
					<a href="./repo.html">Repositories</a>
					<a href="./work.html">Work</a>
				</nav>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<nav class="mobile-menu" id="mobile-menu" hidden>
			<div class="mobile-menu-head"><span class="brand-name">Switchyard</span><button class="hamburger" id="mobile-close" aria-label="Close menu">×</button></div>
			<a href="./">Dashboard</a>
			<a href="./repo.html">Repositories</a>
			<a href="./work.html">Work</a>
			<div class="mobile-auth" id="mobile-auth"></div>
		</nav>
		<main class="site-main">
			<main>
				<section class="panel">
					<h1>Work</h1>
					<form id="work-form" class="inline-form">
						<input name="title" placeholder="What needs doing?" required>
						<select name="kind">
							<option value="feature">feature</option>
							<option value="bug">bug</option>
							<option value="investigation">investigation</option>
							<option value="benchmark">benchmark</option>
							<option value="maintenance">maintenance</option>
							<option value="release">release</option>
						</select>
						<button type="submit">Create work</button>
					</form>
					<div id="work-list" class="list"><p class="muted">Loading…</p></div>
				</section>
			</main>
		</main>
		<script src="assets/js/app.js"></script>
	</body>
</html>
