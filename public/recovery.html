<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Switchyard</title>
		<link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
		<link rel="stylesheet" href="/assets/css/theme.css?v=c22d">
		<link rel="stylesheet" href="/assets/css/components.css?v=avatar-fill-c42">
		<link rel="stylesheet" href="/assets/css/app.css?v=c22d">
		<link rel="stylesheet" href="/assets/css/identity.css?v=auth-recovery-v13">
		<meta name="referrer" content="no-referrer">
		<script src="/assets/js/auth-recovery.js?v=auth-recovery-v13"></script>
	<link rel="stylesheet" href="/assets/css/operations.css?v=c21"></head>
	<body>
		<a class="skip-link" href="#main-content">Skip to content</a>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="/./"><img class="brand-mark-img" src="/assets/images/favicon.webp" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<main class="site-main" id="main-content">
			<div class="auth-page">
			 <section class="auth-card" aria-labelledby="recovery-title">
			  <div class="auth-brand"><img src="/assets/images/favicon.webp" alt="" width="34" height="34"><span>Switchyard</span></div>
			  <h1 id="recovery-title">Account recovery</h1>
			  <p id="recovery-copy" class="muted"></p>
			  <form id="recovery-form" class="auth-form">
			   <label id="recovery-email-label" hidden>Email<input name="email" type="email" autocomplete="email" maxlength="254" disabled></label>
			   <label id="recovery-password-label" hidden>New password<input name="new_password" type="password" autocomplete="new-password" minlength="8" maxlength="72" disabled></label>
			   <label id="recovery-confirm-label" hidden>Confirm password<input name="confirm_password" type="password" autocomplete="new-password" maxlength="72" disabled></label>
			   <button type="submit" class="btn primary" id="recovery-submit">Continue</button>
			  </form>
			  <p id="recovery-status" role="status" aria-live="polite"></p>
			  <a class="btn" id="recovery-next" href="/signin">Back to sign in</a>
			 </section>
			</div>
		</main>
		<script src="/assets/js/code-surface.js?v=c18"></script>
		<script src="/assets/js/markdown.js?v=c18"></script>
		<script src="/assets/js/code-blocks.js"></script>
		<script src="/assets/js/app.js?v=auth-recovery-v13"></script>
	</body>
</html>
