<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Switchyard</title>
		<link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
		<link rel="stylesheet" href="/assets/css/app.css">
	</head>
	<body>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="/"><span class="brand-mark">S</span><span class="brand-name">Switchyard</span></a>
				<nav class="site-nav" id="site-nav">
					<a href="/">Dashboard</a>
					<a href="/repos.html">Repositories</a>
					<a href="/work.html">Work</a>
				</nav>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<nav class="mobile-menu" id="mobile-menu" hidden>
			<div class="mobile-menu-head"><span class="brand-name">Switchyard</span><button class="hamburger" id="mobile-close" aria-label="Close menu">×</button></div>
			<a href="/">Dashboard</a>
			<a href="/repos.html">Repositories</a>
			<a href="/work.html">Work</a>
			<div class="mobile-auth" id="mobile-auth"></div>
		</nav>
		<main class="site-main">
			<main>
				<section class="panel narrow">
					<h1>Sign in</h1>
					<form id="signin-form">
						<label>Username<input name="username" autocomplete="username" required></label>
						<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
						<button type="submit">Sign in</button>
					</form>
					<p class="muted">No account? <a href="#" id="toggle-mode">Register</a></p>
					<p class="error" id="auth-error" hidden></p>
				</section>
			</main>
		</main>
		<script src="/assets/js/app.js"></script>
	</body>
</html>
