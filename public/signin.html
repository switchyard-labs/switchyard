<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Switchyard</title>
		<link rel="icon" type="image/webp" href="assets/images/favicon.webp">
		<link rel="stylesheet" href="assets/css/theme.css">
		<link rel="stylesheet" href="assets/css/app.css">
	</head>
	<body>
		<a class="skip-link" href="#main-content">Skip to content</a>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="./"><img class="brand-mark-img" src="assets/images/favicon.svg" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<nav class="mobile-menu" id="mobile-menu" aria-label="Switchyard" hidden>
			<div class="mobile-menu-head"><a class="brand" href="./"><img class="brand-mark-img" src="assets/images/favicon.svg" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a><button class="hamburger" id="mobile-close" type="button" aria-label="Close navigation">×</button></div>
			<div class="menu-groups">
				<details class="menu-group" open><summary>Git</summary><div class="menu-links">
					<a href="./">Dashboard</a>
					<a href="./repo.html">Repositories</a>
					<a href="./work.html">Work</a>
				</div></details>
				<details class="menu-group" open><summary>Agent-native</summary><div class="menu-links">
					<a href="/operations#attention">Needs Attention</a>
					<a href="/operations#queue">Integration Queue</a>
					<a href="/operations#workflows">Workflows</a>
					<a href="/operations#agents">Agents</a>
				</div></details>
				<details class="menu-group" open><summary>Account</summary><div class="menu-links">
					<div class="mobile-auth" id="mobile-auth"></div>
					<a href="/organizations">Organizations</a><a href="/settings">Settings</a>
				</div></details>
			</div>
			<div class="menu-footer">Git stays Git. Agent-native capability appears when you need it.</div>
		</nav>
		<main class="site-main" id="main-content">
			<main>
				<section class="panel narrow">
					<h1>Sign in</h1>
					<form id="signin-form">
						<label>Username<input name="username" autocomplete="username" required></label>
						<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
						<button type="submit">Sign in</button>
					</form>
					<p class="muted">No account? <a href="#" id="toggle-mode">Register</a></p>
					<p class="error" id="auth-error" hidden></p>
				</section>
			</main>
		</main>
		<script src="assets/js/code-surface.js"></script>
		<script src="assets/js/markdown.js"></script>
		<script src="assets/js/code-blocks.js"></script>
		<script src="assets/js/app.js"></script>
	</body>
</html>
