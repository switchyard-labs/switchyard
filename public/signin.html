<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Switchyard</title>
		<link rel="icon" type="image/webp" href="/assets/images/favicon.webp">
		<link rel="stylesheet" href="/assets/css/theme.css?v=c17">
		<link rel="stylesheet" href="/assets/css/components.css?v=c17b">
		<link rel="stylesheet" href="/assets/css/app.css?v=c17">
	</head>
	<body>
		<a class="skip-link" href="#main-content">Skip to content</a>
		<header class="site-header">
			<div class="header-inner">
				<a class="brand" href="/./"><img class="brand-mark-img" src="/assets/images/favicon.webp" alt="" width="26" height="26"><span class="brand-name">Switchyard</span></a>
				<div class="header-right">
					<span class="auth-state" id="auth-state"></span>
					<button class="hamburger" id="hamburger" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="mobile-menu">☰</button>
				</div>
			</div>
		</header>
		<main class="site-main" id="main-content">
			<div class="auth-page">
			  <section class="auth-card" aria-labelledby="auth-title">
			    <div class="auth-brand"><img src="assets/images/favicon.webp" alt="" width="34" height="34"><span>Switchyard</span></div>
			    <h1 id="auth-title">Sign in to Switchyard</h1>
			    <p class="muted auth-copy">Access repositories, Work, Pull Requests, organizations and the editor.</p>
			    <form id="signin-form" class="auth-form">
			      <label>Username<input name="username" autocomplete="username" required></label>
			      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
			      <button class="btn primary auth-submit" type="submit">Sign in</button>
			    </form>
			    <div class="auth-divider"><span>or</span></div>
			    <button class="btn auth-toggle" type="button" id="toggle-mode">Create an account</button>
			    <p class="error" id="auth-error" hidden></p>
			  </section>
			</div>
		</main>
		<script src="/assets/js/code-surface.js"></script>
		<script src="/assets/js/markdown.js"></script>
		<script src="/assets/js/code-blocks.js"></script>
		<script src="/assets/js/app.js?v=c17"></script>
	</body>
</html>
