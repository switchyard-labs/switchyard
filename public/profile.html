<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switchyard</title><link rel="icon" type="image/webp" href="/assets/images/favicon.webp"><link rel="stylesheet" href="/assets/css/theme.css?v=c18"><link rel="stylesheet" href="/assets/css/components.css?v=c17b">
<link rel="stylesheet" href="/assets/css/app.css?v=c19"><link rel="stylesheet" href="/assets/css/identity.css?v=c19"></head><body><a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header"><div class="header-inner"><a class="brand" href="/"><img class="brand-mark-img" src="/assets/images/favicon.webp" alt="" width="26" height="26"><span>Switchyard</span></a><div class="header-right"><span class="auth-state" id="auth-state"></span><button class="hamburger" id="hamburger" aria-label="Open navigation">☰</button></div></div></header>
<main class="site-main profile-layout" id="main-content">
  <aside class="profile-sidebar"><img id="profile-avatar" class="profile-avatar" src="/api/avatars/user/guest" alt=""><h1 id="profile-name">Loading profile…</h1><div class="profile-handle" id="profile-handle"></div><p id="profile-bio"></p><dl class="profile-meta"><div id="profile-location-wrap" hidden><dt>Location</dt><dd id="profile-location"></dd></div><div id="profile-website-wrap" hidden><dt>Website</dt><dd><a id="profile-website"></a></dd></div></dl><a class="btn" id="profile-edit" href="/settings/profile" hidden>Edit profile</a></aside>
  <section class="profile-main" id="profile-main"><nav class="tabs profile-tabs" aria-label="Profile"><a href="#overview" class="active">Overview</a><a href="#repositories">Repositories <span class="badge" id="profile-repo-count">0</span></a><a href="#activity" id="profile-activity-tab">Activity</a><a href="#people" id="profile-people-tab" hidden>People</a><a href="#teams" id="profile-teams-tab" hidden>Teams</a></nav>
    <section id="overview" class="profile-pane"><article class="profile-readme markdown-body" id="profile-readme" hidden></article><div class="section-head"><h2 id="profile-pins-heading">Repositories</h2></div><div class="repo-card-grid" id="pinned-repos"></div><div class="profile-overview-activity" id="profile-overview-activity" hidden><h2>Recent activity</h2><div id="profile-recent-activity"></div></div></section>
    <section id="repositories" class="profile-pane" hidden><div class="profile-repository-toolbar"><input id="profile-repo-search" type="search" placeholder="Find a repository…" aria-label="Search profile repositories"><select id="profile-repo-visibility" aria-label="Filter repository visibility"><option value="all">All visibility</option><option value="public">Public</option><option value="internal">Internal</option><option value="private">Private</option></select></div><div id="profile-repos"></div></section>
    <section id="activity" class="profile-pane" hidden><h2>Activity</h2><div class="activity-list" id="profile-activity"></div></section>
    <section id="people" class="profile-pane" hidden><h2>People</h2><div class="member-grid" id="profile-members"></div></section>
    <section id="teams" class="profile-pane" hidden><h2>Teams</h2><div id="profile-teams"></div></section>
    <div id="profile-error" class="error-state" role="alert" hidden></div>
  </section>
</main>
<script src="/assets/js/code-surface.js?v=c18"></script><script src="/assets/js/markdown.js?v=c18"></script><script src="/assets/js/app.js?v=c19"></script><script src="/assets/js/app-profile.js?v=c19"></script><script src="/assets/js/code-blocks.js"></script></body></html>
